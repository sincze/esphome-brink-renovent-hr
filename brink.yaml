substitutions:
  name: brink-renovent
  friendly_name: Brink Renovent HR

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: d1_mini

# Pull in the local brink_hru external component (components/brink_hru/).
external_components:
  - source:
      type: local
      path: components

logger:
  level: DEBUG
  # The OpenTherm bit-banging is interrupt-driven on GPIO; keep UART logging on
  # the default pins (not the OT pins) and watch reads live with `esphome logs`.

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}  # fallback hotspot for first provisioning

captive_portal:

# --- Brink Renovent HR over OpenTherm (DIYLess Master OpenTherm Shield) -------
# Pins match the original sketch: inPin=GPIO4 (D2), outPin=GPIO5 (D1).
brink_hru:
  id: brink
  in_pin: 4
  out_pin: 5
  max_volume: 296          # U-max of your unit in m3/h (Brink HR Large here)
  update_interval: 2s      # one OpenTherm read per tick -> full refresh ~34s
  ventilation_tolerance: 4 # +/- % hysteresis; a bigger swing = wall switch, HA yields

sensor:
  - platform: brink_hru
    brink_hru_id: brink
    supply_temperature:
      name: "Temperature from atmosphere"
    exhaust_temperature:
      name: "Temperature from indoors"
    input_volume:
      name: "Current input volume"
    output_volume:
      name: "Current output volume"
    fan_level:
      name: "Fan level"
    pressure_input:
      name: "Pressure input duct"
    pressure_output:
      name: "Pressure output duct"
    bypass_status:
      name: "Bypass status"
    frost_status:
      name: "Frost protection status"
    fault_code:
      name: "Fault code"
    imbalance:
      name: "Fixed imbalance"

binary_sensor:
  - platform: brink_hru
    brink_hru_id: brink
    fault:
      name: "Fault indication"
    filter_dirty:
      name: "Filter dirty"
    ventilation_mode:
      name: "Ventilation mode"

number:
  - platform: brink_hru
    brink_hru_id: brink
    ventilation:
      name: "Ventilation level"
    minimum_atmospheric_temperature:
      name: "Minimum atmospheric temperature bypass"
    minimum_indoor_temperature:
      name: "Minimum indoor temperature bypass"
