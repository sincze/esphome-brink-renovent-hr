# Example device config for the ESPHome Builder (or any other machine).
# Pulls the Brink Renovent HR component + entities straight from GitHub.
#
# Copy this to <yourdevice>.yaml in your ESPHome dashboard, set secrets, flash.

substitutions:
  name: brink-renovent
  friendly_name: Brink Renovent HR
  # Optional overrides (defaults shown):
  # brink_in_pin: "4"
  # brink_out_pin: "5"
  # brink_max_volume: "296"
  # brink_ventilation_tolerance: "4"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

packages:
  brink: github://sincze/esphome-brink-renovent-hr/brink-renovent.yaml@main

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}

captive_portal:
